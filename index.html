<!DOCTYPE html>
<html>
<head>
  <title>Aviator Demo</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    h1 {
      margin-top: 50px;
    }

    #multiplier {
      font-size: 50px;
      margin: 40px;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>✈️ Aviator Demo</h1>

  <div id="multiplier">1.00x</div>

  <button onclick="startGame()">START</button>

  <script>
    function startGame() {
      let x = 1.00;

      let game = setInterval(function () {
        x += 0.01;
        document.getElementById("multiplier").innerText =
          x.toFixed(2) + "x";

        if (x >= 10) {
          clearInterval(game);
        }
      }, 100);
    }
  </script>

</body>
</html>
